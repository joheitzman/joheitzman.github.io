# Refreshes the "All publications" list on both pages from researchmap.
# Runs on the 1st of every month, or on demand from the Actions tab ("Run workflow").
# It only commits when the list has actually changed.
name: Update publications

on:
  schedule:
    - cron: '0 3 1 * *'   # 03:00 UTC (12:00 JST) on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the publication list
        run: python3 scripts/update_publications.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Publication list is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update publication list from researchmap"
          git push
